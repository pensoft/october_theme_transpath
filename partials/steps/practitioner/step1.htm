<div class="step-content">
    <div class="row middle-xs">
        <div class="col-md-10 col-xs-12 start-md center-xs">
            <h4 class="step-question">At what scale do you work?</h4>
        </div>
        <div class="col-md-2 col-xs-12 end-md center-x">
            <div class="step-label">Step 1 / 3</div>
        </div>
    </div>


    <div class="slider-container">


        <input type="range"
               id="scaleSlider"
               class="scale-slider"
               min="0"
               max="100"
               value="0">

        <div class="slider-labels">
            <span class="label-local">Local</span>
            <span class="label-national">National</span>
        </div>

        <div class="scale-indicator">
            <span id="scaleLabel" class="scale-label local">Local</span>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="btnNext">Continue</button>
    </div>
</div>
