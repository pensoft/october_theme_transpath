<div class="step-content">
    <div class="row middle-xs">
        <div class="col-md-10 col-xs-12 start-md center-xs">
            &nbsp;
        </div>
        <div class="col-md-2 col-xs-12 end-md center-xs">
            <div class="step-label">Step 2 / 3</div>
        </div>
    </div>

    {% set isEnablers = (step1Value == 'enablers') %}

    {% if isEnablers %}
    <div class="category-label enablers">Enablers</div>
    {% else %}
    <div class="category-label constraints">Constraints</div>
    {% endif %}

    <div class="step-options expandable-options practitioner step2 {{ step1Value }}">
        {% if categories is not empty %}
        {% for category in categories %}
        <label class="form-check {{ isEnablers ? 'enabler-option' : 'constraint-option' }}">
            <input class="form-check-input" type="radio" name="step2" value="{{ category.slug }}">
            <span class="form-check-label">{{ category.title }}</span>
        </label>
        {% endfor %}
        {% else %}
        <p class="no-items-message">No categories available.</p>
        {% endif %}
    </div>

    <div class="modal-footer">
        <button type="button" class="btn-back" id="btnBack">Back</button>
        <button type="button" class="btn btn-primary" id="btnNext">Continue</button>
    </div>
</div>
