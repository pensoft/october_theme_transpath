<div class="step-content">
    <div class="row middle-xs">
        <div class="col-md-10 col-xs-12 start-md center-xs">
            <h4 class="step-question">
                {% if selectedCategory %}
                <div class="category-label researcher">{{ selectedCategory.title }}</div>
                {% else %}
                    Select a tool to explore
                {% endif %}
            </h4>
        </div>
        <div class="col-md-2 col-xs-12 end-md center-xs">
            <div class="step-label">Step 3 / 3</div>
        </div>
    </div>

    <div class="step-options researcher step3 {{ step2Value }}">
        {% if tools is not empty %}
        {% for tool in tools %}
        <label class="form-check tool-option">
            <input class="form-check-input" type="radio" name="step3" value="{{ tool.slug }}">
            <span class="form-check-label">{{ tool.title }}</span>
            <a href="/actionguide/tool/{{ roleType }}/{{ step1Value }}/{{ step2Value }}/{{ tool.slug }}" class="view-tool-link">
                View tool
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </a>
        </label>
        {% endfor %}
        {% else %}
        <p class="no-items-message">No tools available for this category.</p>
        {% endif %}
    </div>

    <div class="modal-footer">
        <button type="button" class="btn-back" id="btnBack">Back</button>
        {% if tools is not empty %}
        <button type="button" class="btn btn-primary" id="btnViewTool">Continue</button>
        {% endif %}
    </div>
</div>
